[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-channel-bgos"
version = "0.6.1"
description = "BGOS channel adapter for Hermes (vendor plugin; companion to a thin private fork of NousResearch/hermes-agent)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Brand GrowthOS" }]
dependencies = [
  "httpx>=0.27",
  "python-socketio[asyncio_client]>=5.11",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "aiohttp>=3.9",
]

# NOTE: Hermes does not support entry_points-based platform discovery
# (confirmed by reading gateway/config.py + gateway/run.py on
# NousResearch/hermes-agent main @ 2026-04-23). Registration happens in
# the thin private fork via the 16 patch points listed in
# gateway/platforms/ADDING_A_PLATFORM.md. See docs/distribution-decision.md.

[project.scripts]
"hermes-pair-bgos" = "hermes_channel_bgos.pair_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_channel_bgos"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
