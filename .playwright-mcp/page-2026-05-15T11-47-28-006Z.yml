        - generic [ref=e25389] [cursor=pointer]:
          - generic [ref=e25392]:
            - generic [ref=e25394]: "WebSocket feels like a live wire. After the handshake, both sides can send messages without creating a new HTTP request each time. For inbound dispatch, this means the platform can push a message to the adapter the moment it arrives. Latency is usually low because there is no polling interval. The adapter does not need to ask “anything new?” every few seconds. It simply listens. This is especially useful for interactive chat agents, typing indicators, streaming responses, presence updates, reaction events, and any system where immediacy matters. WebSocket also supports bidirectional control flows naturally: the client can send acknowledgements, heartbeats, subscription changes, or command replies over the same connection."
            - generic [ref=e25396]: Long-polling, by contrast, is a disciplined loop of temporary waits. The adapter sends an HTTP request such as “give me updates after id 7307.” If there are updates, the server returns them immediately. If not, the server holds the request open for a while. When the request returns, the adapter processes the response and sends another request. Latency can still be quite good, because the request is often already open when a message arrives. However, there is usually more overhead than WebSocket because each cycle involves HTTP request headers, response headers, connection management unless keep-alive is used, and application logic to reissue the next poll. Long-polling is simpler to deploy through old proxies and strict corporate networks, but it can be less elegant for high-frequency event streams.
            - generic [ref=e25398]: The biggest operational difference is connection lifecycle. WebSockets require a stable long-lived connection. This can be fragile in environments with load balancers, reverse proxies, NAT timeouts, mobile networks, idle connection limits, or Cloudflare-style tunnel behavior. A WebSocket adapter must implement heartbeats, ping/pong handling, reconnect backoff, subscription restoration, and replay after reconnect. When it works, it is efficient and responsive. When it fails silently, the adapter can appear connected while receiving nothing unless heartbeat logic detects the dead connection. Good WebSocket clients treat disconnects as normal, not exceptional.
            - generic [ref=e25400]: Long-polling embraces disconnection as part of the design. Every request ends. Timeouts are expected. The adapter loops. If one request fails, the next can succeed. This makes long-polling robust in many plain HTTP environments. It is easier to inspect with curl, easier to pass through proxies, and often easier to reason about in logs because each poll has a start, end, status code, and response body. The downside is that the adapter must be careful not to create duplicate concurrent polls for the same cursor. Two overlapping polls can return the same event, which makes monotonic cursor filtering essential.
            - generic [ref=e25402]: From a server-resource perspective, WebSockets and long-polling stress different parts of the system. WebSocket uses one long-lived connection per client. That consumes connection state, memory, and file descriptors, but avoids repeated HTTP parsing. Long-polling uses many requests over time. Each waiting request also consumes server resources, but the connection is periodically released and recreated. At small scale, either is fine. At large scale, WebSocket infrastructure must be tuned for many concurrent open sockets, while long-polling infrastructure must be tuned for high request churn and many pending HTTP requests. Neither is automatically superior; the best choice depends on platform architecture.
            - generic [ref=e25404]: "Inbound dispatch semantics also differ. With WebSocket, events arrive as a stream. The adapter often receives a sequence of frames and must parse them continuously. If the connection drops, the adapter must know where to resume. Some platforms provide sequence numbers and resume tokens. Others simply require the client to reconnect and fetch missed events through a REST endpoint. With long-polling, resumption is built into the request model: “give me events after cursor X.” The cursor is part of every request. That makes recovery explicit. However, if the adapter uses the wrong cursor, or fails to persist it, long-polling can repeatedly deliver the same events."
            - generic [ref=e25406]: Latency patterns are different too. WebSocket tends to have low and consistent latency while connected. Long-polling can also be low latency if the server responds immediately when events arrive, but there may be edge cases where latency equals the gap between polls. If the adapter uses short REST polling rather than true long-polling, such as checking every five seconds, then average latency may be around half the interval and worst-case latency around the full interval. That cadence can be visible to users. If an adapter sends a reset acknowledgement every five seconds, it may indicate a REST poll loop repeatedly treating an old message as new. WebSocket failures can also lead to fallback polling, and that fallback can reveal cursor bugs.
            - generic [ref=e25408]: Backpressure is another consideration. In WebSocket systems, messages can arrive faster than the adapter can process them. The client needs buffering, flow control, or a strategy for pausing reads. If the adapter processes one message by invoking a long-running agent turn, it must not block the socket reader entirely or it may miss heartbeats and get disconnected. A common architecture is to have a lightweight socket reader enqueue events, while workers process them separately. In long-polling, backpressure is often naturally tied to the polling loop. If processing takes time before the next poll, the adapter slows its intake. That can be simpler, though it may increase latency for subsequent messages.
            - generic [ref=e25410]: Ordering behaves differently depending on platform guarantees. A WebSocket stream often preserves event order within one connection, but reconnects can introduce gaps or replay. Long-polling often returns batches ordered by id, but overlapping requests or pagination can complicate ordering. In both cases, the adapter should treat platform ordering guarantees as useful but not sufficient. It should use message ids, cursors, and idempotency checks. Transport order is not the same as application delivery correctness.
            - generic [ref=e25412]: Failure visibility is also different. WebSocket failures may appear as disconnect events, heartbeat timeouts, close codes, or stalled reads. Debugging often involves checking ping intervals, proxy idle timeouts, TLS termination, and reconnect logs. Long-polling failures appear as HTTP status codes, timeouts, malformed responses, or repeated empty polls. Debugging often involves inspecting request parameters, cursor state, response bodies, and rate limits. WebSocket bugs can feel like “nothing is arriving.” Long-polling bugs can feel like “the same thing keeps arriving.” Both require careful logging.
            - generic [ref=e25414]: Security and authentication patterns can differ as well. WebSockets often authenticate during handshake using headers, cookies, or query tokens, then keep that authenticated channel open. Token rotation can be awkward if the connection lives longer than the token. Long-polling authenticates each request, which naturally picks up refreshed tokens but increases repeated auth overhead. WebSocket can be more efficient; long-polling can be simpler to integrate with standard HTTP middleware.
            - generic [ref=e25416]: "For a chat adapter, the choice is rarely absolute. A robust adapter may support both. WebSocket can be the primary path for real-time delivery, while long-polling or REST fetch can be the recovery path after reconnect. Long-polling can be the default for platforms that do not support push streams. Webhooks are another alternative, where the platform calls the adapter instead of the adapter calling the platform. Each transport needs the same higher-level discipline: durable cursors, duplicate suppression, scoped conversation identity, error handling, and clear acknowledgement rules."
            - generic [ref=e25418]: The essential difference is that WebSocket is continuous and event-driven, while long-polling is iterative and request-driven. WebSocket optimizes for immediacy and efficient bidirectional communication, at the cost of maintaining a fragile persistent connection. Long-polling optimizes for compatibility and explicit recovery, at the cost of request churn and potential polling cadence artifacts. For inbound message dispatch, either can be reliable if implemented carefully. Neither can save an adapter that lacks durable cursor management. Transport moves bytes; the adapter’s delivery semantics come from how it records, filters, acknowledges, and dispatches those bytes as messages.
