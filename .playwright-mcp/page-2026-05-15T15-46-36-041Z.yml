                - generic [ref=e2678]: Essay on the difference between WebSocket and long-polling for inbound message dispatch
              - generic [ref=e2680]: WebSocket and long-polling are both ways for a chat adapter to receive inbound messages, but they embody different philosophies. WebSocket is a persistent, bidirectional connection. The adapter connects once, keeps the socket open, and the server pushes events as they happen. Long-polling is a repeated request-response pattern. The adapter asks the server for new events, the server waits until something is available or until a timeout expires, then returns a response. The adapter immediately asks again. Both can deliver chat messages in near real time, but their behavior under load, failure, reconnect, ordering, latency, and operational constraints is different.
