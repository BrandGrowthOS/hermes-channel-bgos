          - generic [ref=e25473]:
            - generic [ref=e25475]:
              - generic [ref=e25476]: "1."
              - generic [ref=e25478]: Essay on why monotonic message-id cursors are critical to chat adapters’ at-most-once delivery semantics
            - generic [ref=e25480]: "Monotonic message-id cursors are one of the quiet foundations of reliable chat adapter design. They look simple: every inbound message has an identifier, each new identifier is greater than the last one, and the adapter stores the highest identifier it has successfully processed. Yet this small rule is what allows an adapter to reason about progress, avoid duplicate delivery, and survive restarts without reprocessing the same inbound events again and again. In chat systems, the adapter sits between an external platform and an agent runtime. The platform may deliver messages through webhooks, WebSockets, long-polling, REST polling, or some proprietary event stream. The agent runtime expects each user message to be handled once. The adapter’s job is to transform an unreliable or repeated stream of platform events into a clean sequence of application-level messages. A monotonic cursor gives the adapter a durable boundary between the past and the future."
            - generic [ref=e25482]: At-most-once delivery means that a message should not be delivered to the agent more than once. It does not guarantee that every message will be delivered; that stronger property is at-least-once or exactly-once depending on how it is implemented. At-most-once is about preventing duplicates. In a chat adapter, duplicates are more damaging than they first appear. A repeated user message can cause the agent to answer twice, execute a tool twice, restart a conversation unexpectedly, schedule duplicate jobs, send duplicate notifications, or perform an external side effect twice. If the agent is allowed to run shell commands, modify files, post messages, or call APIs, duplicate delivery is not just noisy; it can be operationally dangerous. A cursor prevents the adapter from treating old messages as new work.
            - generic [ref=e25484]: "The reason monotonicity matters is that it lets the adapter make a simple comparison. If the incoming message id is less than or equal to the stored last-seen id, the adapter knows the event is old and can ignore it. If it is greater, the adapter knows the event is new and can process it. Without monotonic ids, the adapter has to keep a potentially unbounded set of message ids it has seen before. That requires more memory, more storage, and more complicated expiration rules. With monotonic ids, the entire history collapses into one durable value: the highest processed id. That value can be stored in a small file, a database row, Redis, SQLite, or platform-specific state. The algorithm is easy to audit and easy to recover."
            - generic [ref=e25486]: The most important practical scenario is restart recovery. Chat adapters are long-running processes, but they are not immortal. They restart after deployments, package upgrades, server reboots, crashes, OOM events, network failures, or manual maintenance. When the adapter comes back, it often asks the platform for recent messages or opens a stream that may replay buffered events. If the adapter has no durable cursor, it may process all recent messages again. If it stores only in-memory state, that state is lost on restart. A monotonic cursor persisted after successful processing gives the adapter a restart-safe memory. It says, “I have already handled everything through message 7307; only deliver messages greater than 7307.” This makes restarts boring instead of dangerous.
            - generic [ref=e25488]: The cursor also protects against polling overlap. In long-polling or REST polling systems, the adapter may ask the platform every few seconds for new events. If a request times out, is retried, or overlaps with another request, the same event can appear in multiple responses. Some APIs intentionally return the last several events as a safety measure. Others return a page whose boundary is inclusive rather than exclusive. If the adapter tracks a monotonic last id, duplicate responses are harmless. The adapter filters every batch before dispatching, processes only ids greater than the cursor, then advances the cursor when processing succeeds.
            - generic [ref=e25490]: A subtle design point is when to advance the cursor. If the adapter advances it before the message is successfully handed to the agent, then a crash between cursor update and dispatch causes message loss. That is still compatible with at-most-once delivery, because the message is not duplicated, but it weakens reliability. If the adapter advances it only after dispatch succeeds, then a crash after dispatch but before cursor update can cause a duplicate on restart. That is closer to at-least-once delivery. The correct choice depends on the adapter’s delivery contract. For strict at-most-once semantics, the cursor may be advanced before or atomically with claiming the message, accepting possible loss. For practical chat systems, a common compromise is to record an in-progress state or use an idempotency key so that duplicate side effects are avoided even if the message is retried.
            - generic [ref=e25492]: Monotonic cursors also help with concurrency. Modern gateways may process multiple platforms, multiple chats, or multiple threads at the same time. Each stream needs its own cursor scope. A global cursor across unrelated chats can drop messages incorrectly if ids are only monotonic per chat. A per-chat cursor avoids that. Conversely, if platform ids are globally monotonic, a global cursor may be sufficient. The adapter must understand the platform’s id semantics. Is the id numeric? Is it sortable as an integer or only lexicographically? Is it monotonic per bot, per conversation, per user, or per transport connection? Does the platform ever reuse ids after deletion or migration? These details determine how cursor state should be keyed and compared.
            - generic [ref=e25494]: The cursor is also a defense against transport instability. WebSockets reconnect. HTTP requests fail. Gateways crash halfway through receiving an event. Load balancers retry webhook deliveries. Mobile-style APIs sometimes replay the last event after reconnect. If every event is filtered through a monotonic cursor, the adapter becomes resilient to repeated delivery from the platform. The platform can be conservative and resend; the adapter can be conservative and ignore old ids. This separation of concerns is healthy. The platform does not need to know exactly what the agent processed. The adapter only needs a durable record of its own progress.
            - generic [ref=e25496]: There are traps. A cursor must be updated atomically enough for the system’s risk profile. Writing to a local file without fsync may be fine for a hobby bot but weak for production. Updating a cursor after processing an entire batch can cause duplicate processing of earlier messages if the adapter crashes mid-batch. Updating after each message reduces the duplicate window. If processing messages out of order, a simple highest-id cursor can accidentally skip lower-id messages still in progress. Therefore, adapters that process concurrently often need ordered dispatch, per-message acknowledgement, or a more sophisticated pending set. Monotonic ids simplify the common case, but they do not eliminate the need for careful ordering.
            - generic [ref=e25498]: Another trap is assuming that timestamps can replace message ids. Timestamps are often not unique, may arrive out of order, may have clock skew, and may be rounded. If two messages have the same timestamp, a timestamp cursor can drop one. If a platform emits delayed messages with older timestamps, a timestamp cursor can skip them. Monotonic message ids are purpose-built for ordering. They provide a logical sequence, not just a wall-clock observation. In distributed systems, logical sequence is usually more reliable than time.
            - generic [ref=e25500]: A monotonic cursor also makes observability clearer. When debugging a chat adapter, being able to say “last processed id is 7307” is concrete. Logs can show incoming ids, skipped ids, processed ids, and cursor updates. Operators can compare platform state with adapter state. If users report duplicate “conversation reset” acknowledgements every five seconds, cursor state is one of the first things to inspect. Is the cursor file missing? Is it unwritable? Is the adapter reading the wrong home directory? Is the package version using a different cursor path? Is the REST poller failing to persist after processing? A simple cursor value becomes a diagnostic anchor.
            - generic [ref=e25502]: In at-most-once delivery, the adapter’s core promise is restraint. It must not get excited by the same message twice. Monotonic cursors provide that restraint. They turn a messy inbound world of retries, reconnects, polling windows, and replayed events into a stable progression. Every new event must prove that it is beyond the boundary. Every old event is dropped quietly. For chat agents that can take real actions, that boundary is not merely an optimization. It is a safety mechanism, a reliability primitive, and an operational necessity.
            - generic [ref=e25504]:
